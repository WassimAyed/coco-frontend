name: Build & Push frontend image to GHCR

on:
  push:
    branches: [ "main", "covoiturageService-branch" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx (push fiable vers GHCR)
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer le nom de l'image (en minuscules)
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # 1) Build de l'image SANS push, chargée en local pour que Trivy la scanne.
      - name: Build frontend (local, pas encore de push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/coco-frontend:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/coco-frontend:${{ github.sha }}

      # 2) Scan de sécurité Trivy (CVE de l'image).
      #    exit-code '0' = signale sans bloquer (mets '1' pour BLOQUER le pipeline si CVE).
      - name: Scan de sécurité Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/coco-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # 3) Push vers GHCR seulement si le scan est passé.
      - name: Push frontend vers GHCR
        run: |
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/coco-frontend:latest
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/coco-frontend:${{ github.sha }}

  # =====================================================================
  #  ÉTAGE CD (Continuous Deployment) — vrai GitOps
  #  Après le build/push, on écrit le tag (= SHA du commit) dans coco-gitops.
  #  ArgoCD voit le changement Git et synchronise le cluster automatiquement.
  # =====================================================================
  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo GitOps
        uses: actions/checkout@v4
        with:
          repository: WassimAyed/coco-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}   # token avec droit d'écriture sur coco-gitops

      - name: Mettre à jour le tag du frontend (= SHA du commit)
        run: |
          TAG=${{ github.sha }}
          yq -i ".frontend.tag = \"$TAG\"" coco/values.yaml

      - name: Commit & push vers coco-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coco/values.yaml
          git commit -m "CD: déploiement frontend ${{ github.sha }}" || echo "Aucun changement à committer"
          git push
