server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for smaller transfers
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Autorise les uploads (images véhicules, etc.)
    client_max_body_size 10m;

    # =================================================================
    #  REVERSE PROXY vers le backend (résout le piège des URLs en dur)
    #  Le navigateur ne parle qu'à nginx (same-origin → zéro CORS).
    #  nginx relaie les appels API vers les Services Kubernetes internes.
    # =================================================================

    # --- API métier : tout /api/** part vers l'apiGateway ---
    # (la gateway route ensuite vers covoiturageService via Eureka)
    location /api/ {
        proxy_pass http://api-gateway:9092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Authentification / utilisateurs : direct vers user-security-service ---
    location /auth/ {
        proxy_pass http://user-security-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /users {
        proxy_pass http://user-security-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /user/ {
        proxy_pass http://user-security-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets aggressively (they are content-hashed by Angular)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single Page Application: route everything else to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
